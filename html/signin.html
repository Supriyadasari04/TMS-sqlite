<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - SmartDesk</title>

  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/signin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-container">
    <img src="https://img.icons8.com/ios-filled/50/0071E3/ticket.png" alt="Logo" class="logo" style="width: 56px; height: 56px; margin-bottom: 8px;">
    <h1>Welcome Back</h1>
    <p>Sign in to SmartDesk Enterprise</p>

    <div style="text-align: left;">
      <div class="input-group" style="margin-bottom: 16px;">
        <label style="font-size: 13px; font-weight: 500; color: #86868B; margin-bottom: 8px; display: block; margin-left: 4px;">Email Address</label>
        <input id="signin-email" type="email" class="auth-input" placeholder="name@company.com" />
      </div>
      
      <div class="input-group" style="margin-bottom: 16px;">
        <label style="font-size: 13px; font-weight: 500; color: #86868B; margin-bottom: 8px; display: block; margin-left: 4px;">Password</label>
        <div class="password-wrapper">
          <input id="signin-password" type="password" class="auth-input" placeholder="••••••••" />
          <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('signin-password', this)"></i>
        </div>
      </div>

      <div style="text-align: right; margin-top: -8px; margin-bottom: 24px;">
        <a href="#" style="font-size: 14px; color: var(--primary); text-decoration: none; font-weight: 600;" onclick="handleForgotPassword(event)">Forgot Password?</a>
      </div>
      
      <button class="btn-primary" onclick="handleSignIn()">Sign In</button>
    </div>

    <div class="auth-footer">
      <p>Don't have an account? <a href="./signup.html">Sign up</a></p>
      <a class="back-link" href="./landing.html">← Back to home</a>
    </div>
  </div>
    <script src="../scripts/api.js"></script>
    <script src="../scripts/signin.js"></script>
</body>
</html>
