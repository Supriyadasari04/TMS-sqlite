<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Profile — SmartDesk</title>
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header" style="display: flex; align-items: center; gap: 8px; padding-bottom: 20px;">
                <img src="https://img.icons8.com/ios-filled/50/AFCBFF/ticket.png" alt="Logo" style="width: 22px; height: 22px;">
                <h2 class="logo-text" style="font-size: 17px;">SmartDesk</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" id="dash-link" class="nav-item">
                    <i class="fas fa-th-large"></i>
                    <span>Return Workspace</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile-summary">
                    <div class="side-avatar" id="side-avatar">U</div>
                    <div class="user-meta">
                        <span class="name" id="admin-name-side">User</span>
                        <span class="role-label">Account settings</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="profile-container">
                <header style="margin-bottom: 32px;">
                    <h1 style="font-size: 20px;">My Workspace Profile</h1>
                    <p style="font-size: 12.5px; color: var(--text-secondary);">Managed by <span id="display-username" style="font-weight: 600;">User</span></p>
                </header>

                <div class="profile-card">
                    <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 32px; border-bottom: 1px solid var(--divider); padding-bottom: 24px;">
                        <div id="side-avatar" style="width: 48px; height: 48px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600;">U</div>
                        <div>
                            <h2 id="prof-username" style="font-size: 18px; font-weight: 600;">Username</h2>
                            <p id="prof-role" style="font-size: 11px; text-transform: uppercase; color: var(--text-secondary); font-weight: 700; letter-spacing: 0.05em; margin-top: 2px;">ROLE</p>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                        <div class="detail-item">
                            <label>Professional Email</label>
                            <div class="value" id="prof-email">...</div>
                        </div>
                        <div class="detail-item">
                            <label>Unique Identifier</label>
                            <div class="value" id="prof-id" style="font-family: monospace; font-size: 12px;">...</div>
                        </div>
                        <div class="detail-item">
                            <label>Activation Date</label>
                            <div class="value" id="prof-joined">...</div>
                        </div>
                        <div class="detail-item">
                            <label>Membership Status</label>
                            <div class="value"><span class="status-pill resolved">ACTIVE</span></div>
                        </div>
                    </div>

                    <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--divider);">
                        <h3 style="font-size: 14px; margin-bottom: 8px;">Workspace Security</h3>
                        <p style="margin-bottom: 20px; color: var(--text-secondary); font-size: 12.5px; line-height: 1.5;">To update your credentials or secondary access controls, please contact your workspace administrator.</p>
                        
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <button class="btn-outline" onclick="logout()" style="height: 32px; font-size: 12px;">Sign Out</button>
                            <button class="btn-danger" onclick="deleteAccount()" style="height: 32px; font-size: 11px; font-weight: 600;">
                                Terminate Account
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/profile.js"></script>
</body>
</html>
