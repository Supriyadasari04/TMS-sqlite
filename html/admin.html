<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - TicketPro</title>

    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="admin-navbar">
      <h2>Admin Dashboard</h2>
      <div class="admin-welcome">
        Welcome, <span id="admin-name">admin</span>
      </div>
      <div class="nav-right">
        <div class="notif-bell" onclick="toggleNotifications()">
          <i class="fa-solid fa-bell"></i>
          <span id="notif-count">0</span>
        </div>
        <a
          href="./landing.html"
          id="nav-right-link"
          onclick="localStorage.removeItem('currentUser')"
          >Logout</a
        >
    </nav>

    <section class="admin-stats">
      <div class="stat-card">
        <div>
          <h3 id="total-tickets">0</h3>
          <p>Total Tickets</p>
        </div>
      </div>
      <div class="stat-card">
        <div>
          <h3 id="pending-tickets">0</h3>
          <p>Pending</p>
        </div>
      </div>
      <div class="stat-card">
        <div>
          <h3 id="inprogress-tickets">0</h3>
          <p>In Progress</p>
        </div>
      </div>
      <div class="stat-card">
        <div>
          <h3 id="resolved-tickets">0</h3>
          <p>Resolved</p>
        </div>
      </div>
    </section>

    <div class="tab-buttons">
      <button onclick="showTab('tickets')" id="tab-tickets" class="active-tab">
        Ticket Management
      </button>
      <button onclick="showTab('users')" id="tab-users">User Management</button>
    </div>

    <section id="ticket-management" class="admin-section active">
      <div id="ticket-search-container" class="search-container">
        <select id="search-field-dropdown">
          <option value="id">Ticket ID</option>
          <option value="accountHolder">Account Holder</option>
          <option value="title">Issue Type</option>
          <option value="impact">Impact Level</option>
        </select>

        <input
          type="text"
          id="search-input"
          placeholder="Enter search value..."
        />
        <button id="search-button">Search</button>
        <button id="clear-search-button">Clear</button>
      </div>

      <div id="tickets-list" class="tickets-list"></div>
    </section>

    <section id="user-management" class="admin-section">
      <div class="user-management-header">
        <h2>User Management</h2>
        <button id="add-user-btn" class="btn-primary">+ Add User</button>
      </div>

      <div
        id="add-user-container"
        class="add-user-container"
        style="display: none"
      >
        <input type="text" id="new-username" placeholder="Username" />
        <input type="email" id="new-email" placeholder="Email" />
        <select id="new-role">
          <option value="admin">ADMIN</option>
          <option value="agent">AGENT</option>
          <option value="customer">CUSTOMER</option>
        </select>
        <button id="save-user-btn" class="btn-primary">Save</button>
        <button id="cancel-user-btn" class="btn-outline">Cancel</button>
      </div>

      <div id="users-list" class="card-list">
        <p class="empty-text">No users found</p>
      </div>
    </section>

    <!-- Password Reset Modal -->
    <div id="password-reset-modal" class="modal-overlay" style="display: none">
      <div class="modal-box">
        <h3>Reset Your Password</h3>
        <p>
          You are using a temporary password. Please set a new one to continue.
        </p>
        <input
          type="password"
          id="new-password"
          placeholder="Enter new password"
          class="auth-input"
        />
        <input
          type="password"
          id="confirm-password"
          placeholder="Confirm new password"
          class="auth-input"
        />
        <div style="margin-top: 12px; display: flex; gap: 10px">
          <button id="save-new-password" class="btn-primary" style="flex: 1">
            Save Password
          </button>
        </div>
      </div>
    </div>
    <!-- Notifications Popup -->
    <div id="notif-panel" style="display: none">
      <div class="notif-header">
        <h4>Notifications</h4>
        <select id="notif-sort">
          <option value="default">Default</option>
          <option value="latest">Date: Latest</option>
          <option value="earliest">Date: Earliest</option>
        </select>
      </div>
      <div id="notif-list"></div>
      <button
        id="clear-all-notifs"
        class="btn-outline"
        style="width: 100%; margin-top: 10px"
      >
        Clear All
      </button>
    </div>

    <script src="../scripts/admin.js"></script>
  </body>
</html>
