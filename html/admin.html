<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - TicketPro</title>

  <link rel="stylesheet" href="/Ticket-Management-System/styles/base.css" />
  <link rel="stylesheet" href="/Ticket-Management-System/styles/admin.css" />
</head>
<body>
  <nav class="admin-navbar">
    <h2>Admin Dashboard</h2>
    <div class="admin-welcome">Welcome, <span id="admin-name">admin</span></div>
    <div class="notif-bell" onclick="toggleNotifications()">
  🔔 <span id="notif-count">0</span>
</div>
<div id="notif-panel" class="notif-panel" style="display:none;"></div>

    <a href="./landing.html" id="nav-right">Logout</a>
  </nav>

  <section class="admin-stats">
    <div class="stat-card">
      <div>
        <h3 id="total-tickets">0</h3>
        <p>Total Tickets</p>
      </div>
    </div>
    <div class="stat-card">
      <div>
        <h3 id="pending-tickets">0</h3>
        <p>Pending</p>
      </div>
    </div>
    <div class="stat-card">
      <div>
        <h3 id="inprogress-tickets">0</h3>
        <p>In Progress</p>
      </div>
    </div>
    <div class="stat-card">
      <div>
        <h3 id="resolved-tickets">0</h3>
        <p>Resolved</p>
      </div>
    </div>
  </section>

  <div class="tab-buttons">
    <button onclick="showTab('tickets')" id="tab-tickets" class="active-tab">Ticket Management</button>
    <button onclick="showTab('users')" id="tab-users">User Management</button>
  </div>

  <section id="ticket-management" class="admin-section">
    <!-- 🔍 Search Filter Section -->
<div id="ticket-search-container" style="margin: 20px 0; display: flex; gap: 10px; align-items: center;">
  <select id="search-field-dropdown">
    <option value="id">Ticket ID</option>
    <option value="accountHolder">Account Holder</option>
    <option value="title">Issue Type</option>
    <option value="impact">Impact Level</option>
  </select>
  <input type="text" id="search-input" placeholder="Enter search value..." style="flex:1;" />
  <button id="search-button">Search</button>
  <button id="clear-search-button">Clear</button>
</div>

  </section>

  <section id="user-management" class="admin-section" style="display: none;">
    <div class="user-management-header">
    <h2>User Management</h2>
    <button id="add-user-btn" class="btn-primary">+ Add User</button>
    </div>

    <div id="add-user-container" class="add-user-container" style="display: none;">
    <input type="text" id="new-username" placeholder="Username" />
    <input type="email" id="new-email" placeholder="Email" />
    <select id="new-role">
      <option value="admin">ADMIN</option>
      <option value="agent">AGENT</option>
      <option value="customer">CUSTOMER</option>
    </select>
    <button id="save-user-btn" class="btn-primary">Save</button>
    <button id="cancel-user-btn" class="btn-outline">Cancel</button>
    </div>

    <div id="users-list" class="card-list">
    <p class="empty-text">No users found</p>
    </div>
  </section>
<div id="password-reset-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h3>Reset Your Password</h3>
    <p>You are using a temporary password. Please set a new one to continue.</p>
    <input type="password" id="new-password" placeholder="Enter new password" class="auth-input" />
    <input type="password" id="confirm-password" placeholder="Confirm new password" class="auth-input" />
    <div style="margin-top:12px; display:flex; gap:10px;">
      <button id="save-new-password" class="btn-primary" style="flex:1;">Save Password</button>
    </div>
  </div>
</div>
<script src="/Ticket-Management-System/scripts/notifications.js"></script>

  <script src="/Ticket-Management-System/scripts/admin.js"></script>
</body>
</html>
