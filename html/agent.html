<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Dashboard - SmartDesk</title>

    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/customer.css" />
    <link rel="stylesheet" href="../styles/agent.css" />
    <link rel="stylesheet" href="../styles/ticket-detail.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <nav class="customer-navbar">
      <div style="display:flex; align-items:center; gap:10px">
        <img src="https://img.icons8.com/ios-filled/50/007bff/ticket.png" alt="Logo" style="width: 32px; height: 32px;">
        <h2>Agent Dashboard</h2>
      </div>
      <div class="customer-welcome">
        Welcome, <span id="agent-name">Agent</span>
      </div>
      <div class="nav-right">
        <div class="notif-bell" onclick="toggleNotifications()">
          <i class="fa-solid fa-bell"></i>
          <span id="notif-count">0</span>
        </div>
        <a href="#" onclick="logout(); return false;" id="nav-right-link">Logout</a>
      </div>
    </nav>

    <section class="customer-stats">
      <div class="stat-card">
        <h3 id="assigned-tickets">0</h3>
        <p>Total Assigned</p>
      </div>
      <div class="stat-card">
        <h3 id="pending-tickets">0</h3>
        <p>Pending</p>
      </div>
      <div class="stat-card">
        <h3 id="inprogress-tickets">0</h3>
        <p>In Progress</p>
      </div>
      <div class="stat-card">
        <h3 id="resolved-tickets">0</h3>
        <p>Resolved</p>
      </div>
    </section>

    <section class="ticket-section">
      <div class="ticket-header" style="margin-bottom: 20px;">
        <h3>Ticket Management</h3>
        <div class="tab-buttons" style="display: flex; gap: 10px;">
          <button onclick="showTab('assigned')" id="tab-assigned" class="btn-outline active-tab">Assigned</button>
          <button onclick="showTab('inprogress')" id="tab-inprogress" class="btn-outline">In Progress</button>
          <button onclick="showTab('resolved')" id="tab-resolved" class="btn-outline">Resolved</button>
        </div>
      </div>

      <!-- Assigned Tab -->
      <section id="assigned-section" class="admin-section">
        <div class="input-group" style="margin-bottom: 20px;">
          <input
            type="text"
            id="search-assigned"
            placeholder="Search by Ticket ID, Issue Type, Account Name..."
          />
        </div>
        <div id="assigned-list" class="ticket-list">
          <p class="empty-text">No assigned tickets</p>
        </div>
      </section>

      <!-- In Progress Tab -->
      <section id="inprogress-section" class="admin-section" style="display: none">
        <div class="input-group" style="margin-bottom: 20px;">
          <input
            type="text"
            id="search-inprogress"
            placeholder="Search by Ticket ID, Issue Type, Account Name..."
          />
        </div>
        <div id="inprogress-list" class="ticket-list">
          <p class="empty-text">No in progress tickets</p>
        </div>
      </section>

      <!-- Resolved Tab -->
      <section id="resolved-section" class="admin-section" style="display: none">
        <div class="input-group" style="margin-bottom: 20px;">
          <input
            type="text"
            id="search-resolved"
            placeholder="Search by Ticket ID, Issue Type, Account Name..."
          />
        </div>
        <div id="resolved-list" class="ticket-list">
          <p class="empty-text">No resolved tickets</p>
        </div>
      </section>
    </section>

    <!-- Password Reset Modal -->
    <div id="password-reset-modal" class="modal-overlay" style="display: none">
      <div class="modal-box">
        <h3>Reset Password</h3>
        <input type="password" id="new-password" class="auth-input" placeholder="New Password" />
        <input type="password" id="confirm-password" class="auth-input" placeholder="Confirm Password" />
        <button id="save-new-password" class="btn-primary" style="margin-top: 10px; width: 100%;">Save</button>
      </div>
    </div>

    <!-- Notifications Popup -->
    <div id="notif-panel" style="display: none">
      <div class="notif-header">
        <h4>Notifications</h4>
        <select id="notif-sort">
          <option value="default">Default</option>
          <option value="latest">Date: Latest</option>
          <option value="earliest">Date: Earliest</option>
        </select>
      </div>
      <div id="notif-list"></div>
      <button id="clear-all-notifs" class="btn-outline" style="width: 100%; margin-top: 10px">Clear All</button>
    </div>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/ticket-detail.js"></script>
    <script src="../scripts/agent.js"></script>
  </body>
</html>
