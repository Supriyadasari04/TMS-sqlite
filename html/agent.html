<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Workspace — SmartDesk</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/agent.css" />
    <link rel="stylesheet" href="../styles/ticket-detail.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header" style="display: flex; align-items: center; gap: 8px; padding-bottom: 16px;">
                <img src="https://img.icons8.com/ios-filled/50/AFCBFF/ticket.png" alt="Logo" style="width: 20px; height: 20px;">
                <h2 class="logo-text" style="font-size: 16px;">SmartDesk</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="agent.html" class="nav-item active">
                    <i class="fas fa-th-large"></i>
                    <span>Workspace</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile-summary" onclick="window.location.href='profile.html'">
                    <div class="side-avatar" id="side-avatar">A</div>
                    <div class="user-meta">
                        <span class="name" id="agent-name-side">Agent</span>
                        <span class="role-label">Support Specialist</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="padding: 16px 24px; border-bottom: 1px solid var(--divider); display: flex; justify-content: space-between; align-items: center;">
                <div>
                   <h1 style="font-size: 18px;">Support Workspace</h1>
                   <p style="font-size: 12px; color: var(--text-secondary);">Active agent: <span id="agent-name" style="font-weight: 600;">Agent</span></p>
                </div>
                <button class="btn-outline" onclick="logout()" style="height: 30px; font-size: 11px;">Sign Out</button>
            </header>

            <div style="padding: 24px;">
                <div class="stats-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px;">
                    <div class="data-card">
                        <span style="font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Assigned</span>
                        <h3 id="assigned-tickets" style="font-size: 18px; margin-top: 4px;">0</h3>
                    </div>
                    <div class="data-card">
                        <span style="font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Pending</span>
                        <h3 id="pending-tickets" style="font-size: 18px; margin-top: 4px;">0</h3>
                    </div>
                    <div class="data-card">
                        <span style="font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">In Progress</span>
                        <h3 id="inprogress-tickets" style="font-size: 18px; margin-top: 4px; color: var(--info);">0</h3>
                    </div>
                    <div class="data-card">
                        <span style="font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;">Resolved</span>
                        <h3 id="resolved-tickets" style="font-size: 18px; margin-top: 4px; color: var(--success);">0</h3>
                    </div>
                </div>

                <div class="ticket-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h2 style="font-size: 15px;">Inbox Management</h2>
                    <div class="tab-buttons" style="display: flex; gap: 4px;">
                        <button onclick="showTab('assigned')" id="tab-assigned" class="btn-primary" style="height: 28px; font-size: 11px; padding: 0 10px;">Assigned</button>
                        <button onclick="showTab('inprogress')" id="tab-inprogress" class="btn-outline" style="height: 28px; font-size: 11px; padding: 0 10px;">In Progress</button>
                        <button onclick="showTab('resolved')" id="tab-resolved" class="btn-outline" style="height: 28px; font-size: 11px; padding: 0 10px;">Resolved</button>
                    </div>
                </div>

                <!-- Assigned Tab -->
                <section id="assigned-section" class="admin-section">
                    <div style="margin-bottom: 16px;">
                        <input type="text" id="search-assigned" placeholder="Filter assigned tickets..." style="height: 32px; font-size: 12px;" />
                    </div>
                    <div id="assigned-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
                </section>

                <!-- In Progress Tab -->
                <section id="inprogress-section" class="admin-section" style="display: none">
                    <div style="margin-bottom: 16px;">
                        <input type="text" id="search-inprogress" placeholder="Filter active tickets..." style="height: 32px; font-size: 12px;" />
                    </div>
                    <div id="inprogress-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
                </section>

                <!-- Resolved Tab -->
                <section id="resolved-section" class="admin-section" style="display: none">
                    <div style="margin-bottom: 16px;">
                        <input type="text" id="search-resolved" placeholder="Filter history..." style="height: 32px; font-size: 12px;" />
                    </div>
                    <div id="resolved-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- Password Reset Modal -->
    <div id="password-reset-modal" class="modal-overlay" style="display: none">
      <div class="modal-content" style="max-width: 320px; text-align: center;">
        <h2 style="font-size: 16px; margin-bottom: 8px;">Secure Your Account</h2>
        <p style="font-size: 12.5px; color: var(--text-secondary); margin-bottom: 16px;">You are using a temporary password. Please update it.</p>
        <input type="password" id="new-password" placeholder="New Password" style="margin-bottom: 8px;" />
        <input type="password" id="confirm-password" placeholder="Confirm Password" style="margin-bottom: 16px;" />
        <button id="save-new-password" class="btn-primary" style="width: 100%;">Complete Setup</button>
      </div>
    </div>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/ticket-detail.js"></script>
    <script src="../scripts/agent.js"></script>
  </body>
</html>
