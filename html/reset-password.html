<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - SmartDesk</title>

  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/signin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-container">
    <img src="https://img.icons8.com/ios-filled/50/007bff/ticket.png" alt="Logo" class="logo" style="width: 48px; height: 48px;">
    <h1>Reset Password</h1>
    <p>Enter your new password below</p>

    <div style="margin-top: 24px;">
      <div class="password-wrapper">
        <input id="reset-password" type="password" class="auth-input" placeholder="New Password" />
        <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('reset-password', this)"></i>
      </div>
      
      <div class="password-wrapper">
        <input id="reset-confirm-password" type="password" class="auth-input" placeholder="Confirm New Password" />
        <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('reset-confirm-password', this)"></i>
      </div>
      
      <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="handleResetPassword()">Update Password</button>
    </div>

    <div class="auth-footer">
      <a class="back-link" href="./signin.html">← Back to Login</a>
    </div>
  </div>
  
  <script src="../scripts/api.js"></script>
  <script src="../scripts/reset-password.js"></script>
</body>
</html>
