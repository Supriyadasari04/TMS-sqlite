<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - SmartDesk</title>

  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/signup.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>
  <div class="auth-container">
    <img src="https://img.icons8.com/ios-filled/50/0071E3/ticket.png" alt="Logo" class="logo" style="width: 56px; height: 56px; margin-bottom: 8px;">
    <h1>Create Account</h1>
    <p>Join SmartDesk Enterprise today</p>

    <div class="input-grid">
      <div class="input-group">
        <label>Username</label>
        <input id="signup-username" type="text" class="auth-input" placeholder="e.g. jdoe" />
      </div>
      <div class="input-group">
        <label>Email Address</label>
        <input id="signup-email" type="email" class="auth-input" placeholder="e.g. name@company.com" />
      </div>
      <div class="input-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input id="signup-password" type="password" class="auth-input" placeholder="••••••••" />
          <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('signup-password', this)"></i>
        </div>
      </div>
      <div class="input-group">
        <label>Confirm Password</label>
        <div class="password-wrapper">
          <input id="signup-confirm-password" type="password" class="auth-input" placeholder="••••••••" />
          <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('signup-confirm-password', this)"></i>
        </div>
      </div>
    </div>
    
    <div class="input-group">
      <label>Workspace Role</label>
      <select id="signup-role" class="auth-input">
        <option value="" disabled selected>Choose your department...</option>
        <option value="admin">Administration</option>
        <option value="agent">Support Agent</option>
        <option value="customer">Client/Customer</option>
      </select>
    </div>

    <button class="btn-primary" onclick="handleSignUp()">Create Workspace</button>

    <div class="auth-footer">
      <p>Already have an account? <a href="./signin.html">Sign in</a></p>
      <a class="back-link" href="./landing.html">← Back to home</a>
    </div>
  </div>
  <script src="../scripts/api.js"></script>
  <script src="../scripts/signup.js"></script>
</body>
</html>
